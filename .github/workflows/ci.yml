name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 규칙 스키마 검사
        run: pnpm --filter @jipgak/rules-data validate

      - name: Lint (ESLint + Prettier)
        run: pnpm lint

      - name: 타입 검사
        run: pnpm typecheck

      - name: 테스트 (골든 케이스 포함)
        run: pnpm test

      - name: 빌드
        run: pnpm build
